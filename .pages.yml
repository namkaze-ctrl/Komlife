  # ─────────────────────────────────────────────────────────────
  # LANDING THEO ĐỢT — địa chỉ komlife.com.vn/lp/<tên file>, vd abby-1111. Khuôn 8 khối.
  # Gõ "[Chờ ...]" cho ô chưa có: bản nháp hiện vàng; còn ô [Chờ] thì KHÔNG đặt được "Đang chạy".
  - name: landing
    label: "🚀 Landing theo đợt"
    type: collection
    path: src/content/landing
    format: json
    filename: "{fields.duong_dan}.json"
    view: { fields: [nhan, ten_dot, trang_thai, ngay_ket_thuc], primary: nhan }
    fields:
      - name: nhan
        label: Nhãn
        type: select
        required: true
        options: { values: [ abby, ura, spy, givebe, eddy ] }
      - { name: ten_dot, label: "Tên đợt (vd 11.11)", type: string, required: true }
      - { name: duong_dan, label: "Đường dẫn: komlife.com.vn/lp/... (viết thường, không dấu, vd abby-1111)", type: string, required: true, description: "Chỉ đặt lúc tạo mới. Đổi sau khi đã chạy quảng cáo sẽ làm hỏng link." }
      - name: trang_thai
        label: Trạng thái
        type: select
        description: "Nháp = chỉ xem ở bản thử. Đang chạy = lên komlife.com.vn (máy chặn nếu còn ô [Chờ], thiếu giá, thiếu link sàn, dính từ cấm). Hết đợt = tự chuyển về trang nhãn."
        options: { values: [ "Nháp", "Đang chạy", "Hết đợt" ] }
      - { name: ngay_bat_dau, label: Ngày bắt đầu, type: date }
      - { name: ngay_ket_thuc, label: Ngày kết thúc, type: date }
      - { name: nguoi_soat, label: Người soát cuối (ghi tên), type: string }
      - name: mau
        label: Màu của nhãn
        type: object
        fields:
          - { name: chinh, label: "Màu chính (tiêu đề, khối ưu đãi)", type: string }
          - { name: nhan, label: Màu chữ nhấn, type: string }
          - { name: nen, label: Màu nền nhạt, type: string }
          - { name: nut, label: Màu nút, type: string }
          - { name: nut_re, label: Màu nút khi rê chuột, type: string }
      - name: mo_dau
        label: "① Mở đầu"
        type: object
        fields:
          - { name: nhan_nho, label: Nhãn nhỏ trên tiêu đề, type: string }
          - { name: tieu_de, label: "Tiêu đề (*chữ nhấn*, Enter = xuống dòng)", type: text }
          - { name: mo_ta, label: Mô tả, type: text }
          - { name: anh, label: Ảnh chính (ảnh chai thật, ngang 16:10), type: image }
          - { name: anh_phu, label: Ảnh trang trí (linh vật, nền trong suốt), type: image }
      - name: san_pham
        label: "② Giới thiệu sản phẩm"
        type: object
        fields:
          - { name: tieu_de, label: "Tiêu đề (*chữ nhấn*)", type: string }
          - { name: ten, label: Tên sản phẩm đầy đủ (để trống = ẩn khối), type: string }
          - { name: mo_ta, label: Mô tả ngắn, type: text }
          - { name: anh, label: Ảnh sản phẩm (ảnh đứng 4:5), type: image }
          - name: thong_so
            label: Thông số (dạng, dung tích, mùi, dùng cho...)
            type: object
            list: true
            fields:
              - { name: ten, label: Mục, type: string }
              - { name: gia_tri, label: Nội dung, type: string }
          - name: cong_dung
            label: Công dụng (chép đúng chữ in trên nhãn)
            type: object
            list: true
            fields:
              - { name: ten, label: Công dụng, type: string }
              - { name: mo_ta, label: Giải thích ngắn, type: string }
          - name: mui_huong
            label: Mùi hương
            type: object
            list: true
            fields:
              - { name: ten, label: Tên mùi, type: string }
              - { name: mo_ta, label: Mô tả mùi, type: string }
          - { name: cach_dung, label: Cách dùng & liều lượng (đúng nhãn chai), type: text }
      - name: bang_chung
        label: "③ Bằng chứng"
        type: object
        fields:
          - { name: tieu_de, label: Tiêu đề, type: text }
          - { name: mo_ta, label: Mô tả, type: text }
          - name: danh_sach
            label: Các bằng chứng (nên 3)
            type: object
            list: { collapsible: { collapsed: true, summary: "{fields.ten}" } }
            fields:
              - { name: ten, label: Tên, type: string }
              - { name: mo_ta, label: Nội dung (ghi số phiếu, nơi cấp...), type: text }
              - { name: nguon, label: Link xem thêm, type: string }
      - name: dung_luc_nao
