          - name: goi
            label: Các gói
            type: object
            list: true
            fields:
              - { name: ma_gia, label: "Mã giá (trùng ô Mã trong Bảng giá chung)", type: string }
              - { name: ten, label: Tên gói hiển thị, type: string }
              - { name: ghi_chu, label: Ghi chú ngắn, type: string }
          - { name: dieu_kien, label: Điều kiện áp dụng, type: text }
      - name: nut_mua
        label: "⑦ Nút mua — link gian hàng chính hãng của nhãn (web tự gắn UTM)"
        type: object
        fields:
          - { name: shopee, label: Link Shopee, type: string }
          - { name: tiktok_shop, label: Link TikTok Shop, type: string }
      - name: hoi_dap
        label: "⑧ Hỏi đáp (4–6 câu)"
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.hoi}" } }
        fields:
          - { name: hoi, label: Câu hỏi, type: string }
          - { name: dap, label: Trả lời, type: text }

