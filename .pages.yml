        type: object
        fields:
          - { name: tieu_de, label: Tiêu đề, type: text }
          - name: danh_sach
            label: Tình huống (nên 4)
            type: object
            list: true
            fields:
              - { name: ten, label: Tình huống, type: string }
              - { name: mo_ta, label: Mô tả, type: string }
          - name: mui_huong
            label: Mùi hương (nếu có)
            type: object
            list: true
            fields:
              - { name: ten, label: Tên mùi, type: string }
              - { name: mo_ta, label: Mô tả mùi, type: string }
      - name: review
        label: "⑤ Review thật (chép nguyên văn, ghi nguồn)"
        type: object
        fields:
          - { name: tieu_de, label: Tiêu đề, type: text }
          - name: danh_sach
            label: Review
            type: object
            list: { collapsible: { collapsed: true, summary: "{fields.ten}" } }
            fields:
              - { name: noi_dung, label: Nguyên văn đánh giá, type: text }
              - { name: ten, label: Tên hiển thị của khách, type: string }
              - { name: nguon, label: "Nguồn (sàn, ngày)", type: string }
              - { name: link, label: Link tới đánh giá, type: string }
      - name: uu_dai
        label: "⑥ Ưu đãi (giá lấy từ Bảng giá chung)"
        type: object
        fields:
          - { name: tieu_de, label: Tiêu đề, type: text }
